§="palette.proto"

# Sixteen named tokens, not thirteen anonymous hex keys. A hex with no name
# cannot be used twice on purpose, and the theme stops being readable - which is
# what "8 tokens" was aiming at before it turned out that eight was too few and
# the names were the point.
#
# VALUES ARE NOT FILLED IN. They are not sampled from a screenshot, because a
# pixel lifted off one monitor is that monitor's size, not a standard, and it
# breaks on the next screen. They are named here and filled from the published
# theme, and until then every value is null and a check will say so.

&-> virtual:item:§⩲▹bg_base◂→▚:◒⩲▹bg_base◂
      ▚:◒⩲▹bg_base◂
&-> virtual:item:§⩲▹bg_panel◂→▚:◒⩲▹bg_panel◂
      ▚:◒⩲▹bg_panel◂
