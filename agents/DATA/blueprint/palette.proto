      ▚:◒⩲▹text◂
&-> virtual:item:§⩲▹comment◂→▚:◒⩲▹comment◂
      ▚:◒⩲▹comment◂
&-> virtual:item:§⩲▹keyword◂→▚:◒⩲▹keyword◂
      ▚:◒⩲▹keyword◂
&-> virtual:item:§⩲▹string◂→▚:◒⩲▹string◂
      ▚:◒⩲▹string◂
