    -> set(▚:▹bg_base◂:⇐(⊤))
    -> set(▚:▹bg_panel◂:⇐(⊤))
    -> set(▚:▹text◂:⇐(⊤))
    -> set(▚:▹comment◂:⇐(⊤))
    -> set(▚:▹keyword◂:⇐(⊤))
    -> set(▚:▹string◂:⇐(⊤))
    -> set(▚:▹number◂:⇐(⊤))
